name: 주가 데이터 자동 수집

on:
  schedule:
    - cron: "0 21 * * 0" # 매주 월요일 06:00 KST (일요일 21:00 UTC)
  workflow_dispatch: {}    # 수동 실행 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: pip install finance-datareader

      - name: 데이터 수집
        run: python collect_data.py --top 100 --years 12

      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 자동 갱신: $(date +%Y-%m-%d)"
            git push
          fi
